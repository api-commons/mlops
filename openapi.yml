openapi: 3.1.0
info:
  title: MLOps and Model Registry (API Commons)
  version: 0.1.0-draft.20261111
  description: 'The common MLOps and Model Registry interface, distilled from the harvested OpenAPI of 342 providers
    in the APIs.io catalog. Not a product: no one serves this API. It is the shape the market already shares, measured,
    so that providers, agents and integrators can map to one vocabulary. See profile.yml.'
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
paths:
  /ml-models:
    get:
      operationId: listMlModels
      summary: List ml models
      tags:
      - Ml Models
      x-commons-tier: core
      x-commons-share: 0.919
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id001
                  $ref: '#/components/schemas/MlModel'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createMlModel
      summary: Create a ml model
      tags:
      - Ml Models
      x-commons-tier: extended
      x-commons-share: 0.283
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /ml-models/{ml_model_id}:
    parameters:
    - $ref: '#/components/parameters/ml_model_id'
    get:
      operationId: getMlModel
      summary: Get a ml model
      tags:
      - Ml Models
      x-commons-tier: extended
      x-commons-share: 0.475
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
    delete:
      operationId: deleteMlModel
      summary: Delete a ml model
      tags:
      - Ml Models
      x-commons-tier: extended
      x-commons-share: 0.283
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
